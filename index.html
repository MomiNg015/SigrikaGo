<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/sigrika_centered.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SigrikaGo</title>
    <style>
      /* Critical first-paint shell: intentionally independent of downloaded UI assets. */
      [data-site-entry] { --entry-paper: #fffbf2; --entry-ink: #3d2b25; --entry-blue: #9ad3de; box-sizing: border-box; position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--entry-paper); color: var(--entry-ink); font: 16px/1.5 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
      [data-entry-panel] { width: min(320px, 100%); text-align: center; }
      [data-entry-status] { margin: 0 0 22px; font-weight: 700; }
      [data-entry-track] { height: 12px; overflow: hidden; border: 2px solid var(--entry-ink); border-radius: 8px; }
      [data-entry-fill] { height: 100%; background: var(--entry-blue); transform: scaleX(0); transform-origin: left; transition: transform 180ms ease-out; }
      [data-entry-percent] { display: block; margin-top: 12px; font-variant-numeric: tabular-nums; }
      [data-entry-retry] { min-height: 44px; margin-top: 20px; padding: 8px 20px; border: 2px solid var(--entry-ink); border-radius: 8px; background: var(--entry-paper); color: var(--entry-ink); font: inherit; cursor: pointer; }
      [data-entry-retry]:focus-visible { outline: 2px solid var(--entry-ink); outline-offset: 4px; }
      [data-entry-retry]:hover { background: var(--entry-blue); }
      [data-entry-retry][hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) { [data-entry-fill] { transition: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main data-site-entry>
        <div data-entry-panel>
          <p data-entry-status>正在准备页面…</p>
          <div data-entry-track role="progressbar" aria-label="进站资源加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div data-entry-fill></div>
          </div>
          <span data-entry-percent aria-hidden="true">0%</span>
          <button data-entry-retry type="button" hidden>刷新重试</button>
          <noscript>请启用 JavaScript 后刷新页面。</noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
