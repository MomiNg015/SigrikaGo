<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>匹配模式 · 交互样例</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;color:#3d2b25;background:#bfe8dd;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3d2b25;outline-offset:5px}.tools{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 16px}.tools span{font-size:13px}.tools button,.reopen{border:2px solid #3d2b25;border-radius:8px;background:#fffaf0;padding:9px 16px}.tools button[aria-pressed=true]{background:#9ad3de}.stage{display:flex;align-items:center;justify-content:center;min-height:calc(100svh - 90px);padding:28px 16px 44px}.stage.phone{width:min(390px,100%);margin:auto;min-height:740px;background:#9ad3de;border-radius:28px}.modal{position:relative;width:min(780px,100%);background:#fffbf2;border:3px solid #3d2b25;border-radius:18px;box-shadow:7px 8px 0 #3d2b25;padding:28px 30px 22px}.heading{margin:0;height:56px;display:flex;justify-content:center;align-items:center}.heading img{width:205px;max-height:65px;object-fit:contain}.close{position:absolute;right:12px;top:12px;width:44px;height:44px;border:0;background:transparent;font-size:27px}.viewport{position:relative;overflow:hidden;margin-top:18px;padding:10px 8px;height:422px}.card{position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:2px solid #3d2b25;border-radius:14px;padding:18px 24px;background:#fffaf0;box-shadow:3px 4px 0 #3d2b25;overflow:hidden;min-height:94px;isolation:isolate}.card strong{position:relative;font-size:23px;z-index:1}.art{position:absolute;right:54px;width:195px;height:130px;object-fit:contain;opacity:.22;z-index:-1}.end{display:flex;align-items:center;gap:14px;font-size:15px;z-index:1}.spark{position:absolute;top:43px;left:8px;width:calc(100% - 16px);z-index:3;transition:transform 300ms cubic-bezier(.22,1,.36,1);background:#ff9ebb}.spark .chevron{font-size:25px}.practice{position:absolute;left:26px;top:6px;z-index:4;border:0;background:transparent;padding:0;width:130px;height:49px;transition:opacity 120ms}.practice img{width:100%;height:100%;object-fit:contain}.sibling{position:absolute;left:8px;width:calc(100% - 16px);transition:transform 220ms cubic-bezier(.22,1,.36,1),opacity 180ms}.standard{top:153px;background:#9ad3de}.gomoku{top:263px;background:#bfe8dd;transition-delay:35ms}.children{position:absolute;top:101px;left:20px;right:20px;overflow:hidden;padding:10px 5px 8px;pointer-events:none}.child{min-height:82px;margin-bottom:12px;transform:translateY(-300px);opacity:0;transition:transform 320ms cubic-bezier(.22,1,.36,1),opacity 180ms}.child strong{font-size:20px}.child:nth-child(2){background:#9ad3de}.child:nth-child(3){background:#fffbf2;box-shadow:2px 3px 0 #6a554d;color:#6a554d;cursor:not-allowed}.child small{font-size:12px}.expanded .spark{transform:translateY(-33px)}.expanded .practice{opacity:0;pointer-events:none}.expanded .sibling{transform:translateX(-110%);opacity:0;pointer-events:none}.expanded .children{pointer-events:auto}.expanded .child{transform:translateY(0);opacity:1;transition-delay:120ms}.expanded .child:nth-child(2){transition-delay:165ms}.expanded .child:nth-child(3){transition-delay:210ms}.foot{display:flex;justify-content:center}.back{min-width:140px;min-height:44px;border:2px solid #3d2b25;border-radius:10px;background:white;box-shadow:2px 3px 0 #3d2b25}.result{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3d2b25;color:white;padding:12px 18px;border-radius:10px;max-width:calc(100% - 32px);text-align:center;z-index:10;font-size:14px}.result:empty{display:none}.phone .modal{padding:24px 14px 18px}.phone .card{padding:16px}.phone .card strong{font-size:20px}.phone .child strong{font-size:18px}.phone .art{right:25px;width:145px}.phone .end{gap:6px;font-size:12px}.phone .heading img{width:175px}.phone .children{left:14px;right:14px}
@media(max-width:520px){.modal{padding:24px 14px 18px}.card{padding:16px}.card strong{font-size:20px}.child strong{font-size:18px}.art{right:25px;width:145px}.end{gap:6px;font-size:12px}.heading img{width:175px}.children{left:14px;right:14px}.stage{align-items:flex-start}.tools{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
<nav class="tools" aria-label="样例预览工具"><span>交互样例 · 不发起真实对局</span><button id="desktop" aria-pressed="true">桌面</button><button id="phone" aria-pressed="false">手机竖屏</button></nav>
<main class="stage" id="stage">
<section class="modal" id="modal" aria-label="选择对弈模式">
<h1 class="heading"><img src="../../../public/assets/window-titles/match-mode.webp" alt="选择对弈模式"></h1><button class="close" aria-label="关闭窗口">×</button>
<div class="viewport">
<button class="practice" aria-label="准时宝陪练"><img src="../../../public/assets/home/home-practice-zhunshibao.webp" alt="准时宝陪练"></button>
<button class="card spark" id="spark" aria-expanded="false" aria-controls="children"><img class="art" src="../../../public/assets/match-modes/mode-spark.png" alt=""><strong>星炬对弈</strong><span class="end"><span id="parentHint">选择模式</span><span class="chevron">⌄</span></span></button>
<button class="card sibling standard" data-result="标准对弈：接入现有匹配流程"><img class="art" src="../../../public/assets/match-modes/mode-standard.png" alt=""><strong>标准对弈</strong><span class="end">→</span></button>
<button class="card sibling gomoku" data-result="五子棋：接入现有匹配流程"><img class="art" src="../../../public/assets/match-modes/mode-gomoku.png" alt=""><strong>来下五子棋吗？</strong><span class="end">→</span></button>
<div class="children" id="children" inert>
<button class="card child" data-result="常规匹配：接入现有星炬匹配流程"><strong>常规匹配</strong><span class="end">→</span></button>
<button class="card child" data-result="吃子挑战赛：接入现有准时宝挑战流程"><strong>吃子挑战赛</strong><span class="end">→</span></button>
<button class="card child" disabled><strong>队际赛</strong><small>敬请期待</small></button>
</div></div>
<footer class="foot"><button class="back" id="back">取消</button></footer>
</section><button class="reopen" id="reopen" hidden>重新打开匹配窗口</button>
</main><div class="result" id="result" role="status"></div>
<script>
const modal=document.querySelector('#modal'),spark=document.querySelector('#spark'),children=document.querySelector('#children'),back=document.querySelector('#back'),reopen=document.querySelector('#reopen');let expanded=false,timer;
function setExpanded(value){expanded=value;modal.classList.toggle('expanded',value);spark.setAttribute('aria-expanded',String(value));children.inert=!value;document.querySelectorAll('.sibling,.practice').forEach(el=>el.inert=value);document.querySelector('#parentHint').textContent=value?'收起':'选择模式';spark.querySelector('.chevron').textContent=value?'⌃':'⌄';back.textContent=value?'← 返回':'取消';if(!value)spark.focus({preventScroll:true});}
function close(){setExpanded(false);modal.hidden=true;reopen.hidden=false;reopen.focus();}
spark.onclick=()=>setExpanded(!expanded);back.onclick=()=>expanded?setExpanded(false):close();document.querySelector('.close').onclick=close;reopen.onclick=()=>{modal.hidden=false;reopen.hidden=true;spark.focus();};document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden){expanded?setExpanded(false):close();}});
function notice(text){clearTimeout(timer);document.querySelector('#result').textContent='样例 · '+text;timer=setTimeout(()=>document.querySelector('#result').textContent='',3000);}
document.querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>notice(el.dataset.result));document.querySelector('.practice').onclick=()=>notice('准时宝陪练：保留现有难度选择');
for(const mode of ['desktop','phone'])document.querySelector('#'+mode).onclick=()=>{document.querySelector('#stage').classList.toggle('phone',mode==='phone');for(const name of ['desktop','phone'])document.querySelector('#'+name).setAttribute('aria-pressed',String(name===mode));};
</script></html>
