root /opt/sigrikago/dist;
index index.html;
etag on;
sendfile on;
tcp_nopush on;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

location ^~ /socket.io/ {
    proxy_pass http://sigrikago_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location ^~ /api/ {
    proxy_pass http://sigrikago_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering on;
}

location = /health/live {
    proxy_pass http://sigrikago_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering on;
}

location = /health/ready {
    proxy_pass http://sigrikago_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering on;
}

location ^~ /uploads/ {
    alias /var/lib/sigrikago/uploads/;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}

location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(css|js)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https: wss: ws:; font-src 'self' https: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src-attr 'none'; upgrade-insecure-requests" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
