<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>设置窗口 · 三套样板</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#dfe2e0;color:#302e2c;font:14px 'Microsoft YaHei',sans-serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #ccc}nav{display:flex;gap:6px}button,select{font:inherit;color:inherit;border:1px solid #c5c5c5;border-radius:6px;background:#fff;min-height:38px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#302e2c;color:#fff}label{display:flex;align-items:center;gap:8px}.note{margin-left:auto;font-size:12px;color:#605d59}.description{margin:0;padding:10px 18px;background:#f6f6f4;font-size:13px;line-height:1.5}.stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}iframe{border:0;width:100%;height:100%;background:#fffbf2}body.phone iframe{width:390px;max-width:100%}body.small iframe{width:320px;max-width:100%}:focus-visible{outline:3px solid #397e89;outline-offset:2px}@media(max-width:650px){header{padding:8px;gap:8px}nav{width:100%}nav button{flex:1;padding:6px 4px;font-size:12px}.note{display:none}.description{padding:8px;font-size:12px}}
</style></head><body><header><nav aria-label="设计方案"><button data-view="list">1 纸页清单</button><button data-view="mixer">2 社团调音台</button><button data-view="folio">3 折页设置册</button><button data-view="current">现有界面</button></nav><label>尺寸<select id="size"><option value="desktop">桌面 / 自适应</option><option value="phone">手机 390px</option><option value="small">窄屏 320px</option></select></label><span class="note">独立样板 · 调整不会保存到账号</span></header><p class="description"></p><main class="stage"><iframe title="设置窗口预览"></iframe></main><script>
const descriptions={list:'纸页清单：主音量优先，其他声音按行排列；明确静音开关，操作最直接。',mixer:'社团调音台：保留手绘播放器，四根纵向推杆并排，强调调节声音的触感。',folio:'折页设置册：左侧分类、右侧双列音量便笺；手机分类移到顶部，保留分区关系。',current:'现有设置组件，使用隔离数据展示；修改仅停留在此预览。'};const params=new URLSearchParams(location.search),buttons=[...document.querySelectorAll('[data-view]')],frame=document.querySelector('iframe'),size=document.querySelector('#size');let view=Object.hasOwn(descriptions,params.get('view'))?params.get('view'):'list';if(['phone','small'].includes(params.get('size')))size.value=params.get('size');function render(){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('.description').textContent=descriptions[view];document.body.className=size.value;frame.src=`./preview.html?view=${view}`;history.replaceState(null,'',`?view=${view}&size=${size.value}`)}buttons.forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});size.onchange=render;render();
</script></body></html>
