<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>登录与注册 · 三套手绘设计</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e7e7;color:#302e2c;font:14px 'Microsoft YaHei',sans-serif;height:100dvh;display:flex;flex-direction:column}header{background:#fff;padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #ccc}nav{display:flex;gap:6px}button,select{font:inherit;color:inherit;border:1px solid #c4c4c4;background:#fff;border-radius:6px;min-height:38px;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{background:#302e2c;color:#fff;border-color:#302e2c}label{display:flex;align-items:center;gap:8px}.notice{margin-left:auto;font-size:12px;color:#605d59}.description{margin:0;padding:10px 18px;background:#f6f6f4;font-size:13px;line-height:1.5}.stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}iframe{width:100%;height:100%;border:0;background:#fffbf2}body.phone iframe{width:390px;max-width:100%}body.small iframe{width:320px;max-width:100%}:focus-visible{outline:3px solid #2b737b;outline-offset:2px}@media(max-width:650px){header{padding:8px;gap:8px}nav{width:100%}nav button{flex:1;font-size:12px;padding:6px}.notice{display:none}.description{font-size:12px;padding:8px}}
</style></head><body><header><nav aria-label="设计方案"><button data-view="sheet">1 社团签到纸</button><button data-view="welcome">2 左右迎新页</button><button data-view="register">3 入部登记册</button></nav><label>尺寸<select id="size"><option value="desktop">桌面 / 自适应</option><option value="phone">手机 390px</option><option value="small">窄屏 320px</option></select></label><span class="notice">交互样板 · 不会登录或创建账号</span></header><p class="description"></p><main class="stage"><iframe title="登录注册设计预览"></iframe></main><script>
const descriptions={sheet:'社团签到纸：保留角色探出纸面的构图，减轻输入框与页签描边，集中主按钮。',welcome:'左右迎新页：原手绘角色完整放大，桌面左右分区，手机改为紧凑的上下构图。',register:'入部登记册：角色成为页角签名，登录与注册采用目录页签，表单以横线组织。'};
const params=new URLSearchParams(location.search),buttons=[...document.querySelectorAll('[data-view]')],frame=document.querySelector('iframe'),size=document.querySelector('#size');let view=Object.hasOwn(descriptions,params.get('view'))?params.get('view'):'sheet';if(['phone','small'].includes(params.get('size')))size.value=params.get('size');function render(){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('.description').textContent=descriptions[view];document.body.className=size.value;frame.src=`./preview.html?view=${view}`;history.replaceState(null,'',`?view=${view}&size=${size.value}`)}buttons.forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});size.onchange=render;render();
</script></body></html>
