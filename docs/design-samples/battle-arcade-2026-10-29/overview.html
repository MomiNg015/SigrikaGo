<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三套功能区对照</title>
<link rel="stylesheet" href="sample.css">
<style>
body{padding:32px;width:1160px;background:#f6f2e9}h1{font-size:28px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}header p{font-size:13px}article{border-top:1px solid #c7baaa;padding:18px 0 12px}h2{font-size:19px;font-weight:400;margin:0 0 12px}h2 span{font-size:12px;color:#6a554d;margin-left:14px}.pair{display:grid;grid-template-columns:690px 386px;gap:20px;align-items:center}.pair img{width:100%;display:block}.labels{display:flex;justify-content:space-between;font-size:12px;color:#6a554d;padding-right:315px}footer{font-size:12px;color:#6a554d;margin-top:12px}
</style></head><body>
<header><h1>对弈功能区 · 街机按钮三案</h1><p>技能 ＞ 数目 / 认输 ＞ 弃手 / 和棋</p></header>
<div class="labels"><span>桌面</span><span>手机竖屏 · 390px</span></div>
<article><h2>01 圆帽街机<span>中央大圆键，向两侧逐级减弱</span></h2><div class="pair"><img src="controls-round-900.png" alt="圆帽街机桌面"><img src="controls-round-390.png" alt="圆帽街机手机"></div></article>
<article><h2>02 阶梯键组<span>宽技能键与高低键帽，手机收为双层</span></h2><div class="pair"><img src="controls-keys-900.png" alt="阶梯键组桌面"><img src="controls-keys-390.png" alt="阶梯键组手机"></div></article>
<article><h2>03 掌机控制舱<span>右侧技能拇指区，左侧分组操作</span></h2><div class="pair"><img src="controls-pod-900.png" alt="掌机控制舱桌面"><img src="controls-pod-390.png" alt="掌机控制舱手机"></div></article>
<footer>全部沿用学院暖纸与墨色轮廓。打开交互预览，可体验按压、技能选中、禁用与确认弹窗。</footer>
</body></html>
