<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>排行榜 · 三套设计样板</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#302b28;font:14px 'Microsoft YaHei',sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid #ccc;flex-wrap:wrap}nav{display:flex;gap:5px}button,select{font:inherit;color:inherit;min-height:40px;background:white;border:1px solid #bbb;border-radius:5px;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{background:#302b28;color:white;border-color:#302b28}label{display:flex;align-items:center;gap:7px;font-size:12px}.note{margin-left:auto;color:#625d59;font-size:12px}.stage{flex:1;min-height:0;display:flex;justify-content:center;background:#dedfdf;overflow:auto}iframe{border:0;width:100%;height:100%;background:#f8f4ea}body.phone iframe{width:390px;max-width:100%}button:focus-visible,select:focus-visible{outline:3px solid #2a6d72;outline-offset:2px}@media(max-width:650px){header{padding:6px;gap:6px}nav{width:100%}nav button{flex:1;padding:6px;font-size:12px}.note{display:none}label{flex:1}select{padding:3px;font-size:12px}}
</style></head><body><header><nav aria-label="设计方案"><button data-view="honor">1 校园荣誉榜</button><button data-view="podium">2 领奖台</button><button data-view="ledger">3 竞技成绩单</button><button data-view="current">正式版</button></nav><label>预览<select id="size"><option value="desktop">桌面 / 自适应</option><option value="phone">手机竖屏</option></select></label><label>状态<select id="state"><option value="normal">正常</option><option value="tie">多人同分</option><option value="long">长用户名</option><option value="unranked">我未上榜</option><option value="empty">暂无排行</option><option value="loading">加载中</option><option value="error">加载失败</option></select></label><span class="note">设计样板 · 模拟数据</span></header><main class="stage"><iframe title="排行榜设计预览"></iframe></main><script>
const buttons=[...document.querySelectorAll('[data-view]')],frame=document.querySelector('iframe'),params=new URLSearchParams(location.search);let view=buttons.some(b=>b.dataset.view===params.get('view'))?params.get('view'):'honor';
if(params.get('size')==='phone'){document.querySelector('#size').value='phone';document.body.classList.add('phone')} function render(){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));frame.src=`./preview.html?view=${view}&state=${document.querySelector('#state').value}`;history.replaceState(null,'',`?view=${view}`)}
buttons.forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelector('#state').onchange=render;document.querySelector('#size').onchange=e=>document.body.classList.toggle('phone',e.target.value==='phone');render();
</script></body></html>
