<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顶部公告 · 三版样板</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./preview.css">
</head>
<body>
  <!-- Local design samples. Real HomeHeader in isolated frames; mock admin changes are not persisted. -->
  <main class="studio">
    <div class="intro"><div><p class="eyebrow">星炬学院 · 界面设计样板</p><h1>把重要消息，放在最上面。</h1><p>顶部公告 / 单行显示 / 霞鹜漫黑</p></div><span class="sample-note">本地样板 · 非正式公告</span></div>
    <nav class="directions" aria-label="公告设计方案">
      <button type="button" data-variant="mint" aria-pressed="true"><span class="swatch mint"></span><strong>1 · 薄荷播报条</strong><span>轻量、清爽，适合日常提醒</span></button>
      <button type="button" data-variant="ribbon" aria-pressed="false"><span class="swatch ribbon"></span><strong>2 · 暖黄公告签</strong><span>纸签与斜切标签，更有校园感</span></button>
      <button type="button" data-variant="ink" aria-pressed="false"><span class="swatch ink"></span><strong>3 · 深墨维护栏</strong><span>深色底与状态点，重要信息更醒目</span></button>
    </nav>
    <div class="preview-toolbar"><div class="segmented" aria-label="展示方式"><button type="button" id="focus-view" aria-pressed="true">单版体验</button><button type="button" id="compare-view" aria-pressed="false">三版同屏</button></div><div class="segmented" aria-label="预览宽度"><button type="button" data-width="desktop" aria-pressed="true">桌面</button><button type="button" data-width="390" aria-pressed="false">390px</button><button type="button" data-width="320" aria-pressed="false">320px</button></div></div>
    <section class="preview-stage" aria-label="玩家界面预览">
      <article class="frame-card" data-frame="mint"><div class="frame-caption">1 · 薄荷播报条 <span>38px 高 · 清浅薄荷</span></div><iframe src="./frame.html?variant=mint" title="薄荷播报条预览"></iframe></article>
      <article class="frame-card" data-frame="ribbon" hidden><div class="frame-caption">2 · 暖黄公告签 <span>40px 高 · 暖纸标签</span></div><iframe src="./frame.html?variant=ribbon" title="暖黄公告签预览"></iframe></article>
      <article class="frame-card" data-frame="ink" hidden><div class="frame-caption">3 · 深墨维护栏 <span>40px 高 · 深墨强调</span></div><iframe src="./frame.html?variant=ink" title="深墨维护栏预览"></iframe></article>
    </section>
    <section class="admin-demo" aria-labelledby="admin-title">
      <div class="admin-heading"><div><p class="eyebrow">后台操作模拟</p><h2 id="admin-title">顶部公告</h2><p>编辑后应用到上方预览，关闭即收起整条公告。</p></div><label class="toggle"><input id="enabled" type="checkbox" checked><span class="toggle-track" aria-hidden="true"></span><span id="enabled-label">公告已开启</span></label></div>
      <form id="editor"><label for="notice-text">公告内容</label><textarea id="notice-text" rows="2" maxlength="500">维护预告：10 月 23 日 02:00—04:00 进行服务器维护，期间暂时无法登录与匹配，请提前安排对局。维护完成后将恢复开放，感谢各位同学的理解与耐心等待。</textarea><div class="editor-footer"><div class="presets"><button type="button" data-preset="short">试试短公告</button><button type="button" data-preset="long">试试长公告</button><span id="character-count"></span></div><button class="apply" type="submit">应用到预览</button></div></form>
      <p class="save-status" id="save-status" role="status">当前为示例内容，仅在本页生效。</p>
    </section>
    <p class="footnote">短文字保持静止；超长文字从右向左循环。悬停、键盘聚焦或点击暂停可停住阅读。系统开启「减少动态效果」时，可横向滑动阅读。</p>
  </main>
  <script type="module" src="./preview.js"></script>
</body></html>
