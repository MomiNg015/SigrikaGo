<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>移动端观战 · 三版布局</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e3d9;color:#3d2b25;font:14px "Microsoft YaHei",sans-serif}header{display:flex;align-items:center;justify-content:center;gap:16px;min-height:58px;padding:8px}button,select{min-height:40px;border:1px solid #3d2b25;background:#fffaf0;color:inherit;font:inherit;padding:4px 10px}button{cursor:pointer}button[aria-pressed=true]{background:#bfe8dd}button:focus-visible,select:focus-visible{outline:2px solid #3d2b25;outline-offset:2px}nav{display:none}main{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:0 16px 16px}section{width:var(--phone-width,390px);flex:none;min-width:0}h2{font-size:15px;margin:0;padding:6px 0 12px;font-weight:600;text-align:center}iframe{display:block;width:100%;height:calc(100dvh - 112px);min-height:568px;border:0;background:#fffaf0}label{display:flex;align-items:center;gap:8px}@media(max-width:1100px){header{flex-wrap:wrap;gap:8px}nav{display:flex;gap:5px;justify-content:center;padding:0 6px 8px}nav button{font-size:12px;padding:5px 8px}main{padding:0;display:block}section{width:min(var(--phone-width,390px),100%);max-width:430px;margin:auto}section:not(.active){display:none}h2{display:none}iframe{height:calc(100dvh - 106px);min-height:0}}
</style></head><body><header><label>手机宽度 <select id="width"><option>390</option><option>360</option><option>320</option><option>430</option></select></label><button id="names" aria-pressed="false">长昵称 / 大数值</button></header><nav><button data-view="split">1 · 计分牌名册</button><button data-view="versus">2 · 中央对阵牌</button><button data-view="columns">3 · 赛程票签</button></nav><main><section data-view="split" class="active"><h2>1 · 计分牌名册</h2><iframe title="方案 1 计分牌名册" src="./preview.html?view=split"></iframe></section><section data-view="versus"><h2>2 · 中央对阵牌</h2><iframe title="方案 2 中央对阵牌" src="./preview.html?view=versus"></iframe></section><section data-view="columns"><h2>3 · 赛程票签</h2><iframe title="方案 3 赛程票签" src="./preview.html?view=columns"></iframe></section></main><script>
let long=false;const sections=[...document.querySelectorAll('section')],tabs=[...document.querySelectorAll('nav button')];
function choose(view){if(!sections.some(s=>s.dataset.view===view))view='split';sections.forEach(s=>s.classList.toggle('active',s.dataset.view===view));tabs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));history.replaceState(null,'',`?view=${view}`)}
tabs.forEach(b=>b.onclick=()=>choose(b.dataset.view));choose(new URLSearchParams(location.search).get('view'));
document.querySelector('#names').onclick=e=>{long=!long;e.currentTarget.setAttribute('aria-pressed',String(long));sections.forEach(s=>s.querySelector('iframe').src=`./preview.html?view=${s.dataset.view}${long?'&long':''}`)};
document.querySelector('#width').onchange=e=>document.documentElement.style.setProperty('--phone-width',e.target.value+'px');
</script></body></html>
