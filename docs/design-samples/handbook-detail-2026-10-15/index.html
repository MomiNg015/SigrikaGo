<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>部员手册 · 详情与衣柜设计比较</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;color:#34312d;background:#e6e5e0;font:14px 'Microsoft YaHei',sans-serif}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #d5d2ca}nav{display:flex;gap:6px}button,select{font:inherit;min-height:38px;padding:6px 10px;border:1px solid #c8c5bc;border-radius:6px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#373530;color:#fff}label{display:flex;align-items:center;gap:5px}.note{margin-left:auto;color:#777;font-size:12px}p{margin:0;padding:10px 18px;background:#f8f7f3;font-size:13px;line-height:1.5}main{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}iframe{border:0;width:100%;height:100%}body.phone iframe{width:390px;max-width:100%}body.small iframe{width:320px;max-width:100%}:focus-visible{outline:3px solid #48828a;outline-offset:2px}@media(max-width:650px){header{padding:8px;gap:7px}nav{width:100%;gap:4px}nav button{flex:1;padding:6px 3px;font-size:12px}.note{display:none}p{padding:8px}}
</style></head><body><header><nav aria-label="方案"><button data-view="dossier">1 夹页档案</button><button data-view="stage">2 立绘展台</button><button data-view="notebook">3 随身手账</button><button data-view="current">现有窗口</button></nav><label>角色<select id="character"><option value="denia">达妮娅</option><option value="sigrika">西格莉卡</option></select></label><label>尺寸<select id="size"><option value="desktop">桌面 / 自适应</option><option value="phone">手机 390px</option><option value="small">窄屏 320px</option></select></label><span class="note">独立设计样板 · 拥有状态为示例 · 不保存账号</span></header><p id="description"></p><main><iframe title="角色详情与衣柜预览"></iframe></main><script>
const descriptions={dossier:'夹页档案：左侧保留人物，右侧切换详情与衣柜。技能先读、换装集中确认，改动最稳妥。',stage:'立绘展台：让角色成为视觉中心。衣柜使用大图试穿＋服装缩略图，适合欣赏与快速比较。',notebook:'随身手账：技能、人物、衣柜分成三枚书签。每次只处理一件事，手机阅读最轻。',current:'现有正式组件对照。使用相同角色与服装数据，所有换装均为本地模拟。'};
const params=new URLSearchParams(location.search),buttons=[...document.querySelectorAll('[data-view]')],frame=document.querySelector('iframe'),size=document.querySelector('#size'),character=document.querySelector('#character');let view=Object.hasOwn(descriptions,params.get('view'))?params.get('view'):'dossier';if(['phone','small'].includes(params.get('size')))size.value=params.get('size');if(params.get('character')==='sigrika')character.value='sigrika';
function render(){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('#description').textContent=descriptions[view];document.body.className=size.value;frame.src=`./preview.html?view=${view}&character=${character.value}`;history.replaceState(null,'',`?view=${view}&character=${character.value}&size=${size.value}`)}buttons.forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});size.onchange=()=>{document.body.className=size.value;history.replaceState(null,'',`?view=${view}&character=${character.value}&size=${size.value}`)};character.onchange=render;render();
</script></body></html>
