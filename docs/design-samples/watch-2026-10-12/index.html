<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>观战窗口 · 三版设计</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#fffaf0;color:#3d2b25;font:14px "Microsoft YaHei",sans-serif}nav{display:flex;justify-content:center;gap:14px;padding:12px;border-bottom:2px solid #3d2b25}button{min-height:46px;padding:8px 24px;color:inherit;background:transparent;border:1px solid transparent;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#bfe8dd;border-color:#3d2b25;box-shadow:2px 2px #3d2b25}button:focus-visible{outline:2px solid #3d2b25;outline-offset:3px}iframe{border:0;width:100%;flex:1;min-height:0}@media(max-width:600px){nav{gap:5px;padding:8px 6px}button{flex:1;padding:6px 3px;font-size:12px}}
</style></head><body><nav aria-label="观战设计样板"><button data-view="ledger" aria-pressed="true">1 · 赛事名册</button><button data-view="duel" aria-pressed="false">2 · 对阵看板</button><button data-view="ticket" aria-pressed="false">3 · 观战票根</button></nav><iframe title="观战窗口样板" src="./preview.html?view=ledger"></iframe><script>
const frame=document.querySelector('iframe'),buttons=[...document.querySelectorAll('button[data-view]')];
function select(view){if(!buttons.some(b=>b.dataset.view===view))view='ledger';buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));frame.src=`./preview.html?view=${view}`;history.replaceState(null,'',`?view=${view}`)}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.view)));select(new URLSearchParams(location.search).get('view')||'ledger');
</script></body></html>
