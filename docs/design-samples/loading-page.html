<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbf2">
  <title>SigrikaGo · 加载页样板</title>
  <link rel="stylesheet" href="./loading-page/loading-page.css">
  <link rel="preload" as="image" href="./loading-page/assets/character-complete.png">
  <link rel="preload" as="image" href="./loading-page/assets/loading-blink-fast.webp">
  <link rel="preload" as="image" href="./loading-page/assets/cloud-alternate.png">
</head>
<body>
  <main class="thinking-loading" aria-label="资源加载">
    <div class="loading-composition">
      <section class="loading-art" aria-label="角色正在思考围棋死活题">
        <div class="thought-cloud">
          <img class="thought-outline" src="./loading-page/assets/cloud.png" alt="" draggable="false">
          <img class="thought-outline thought-outline-alternate" src="./loading-page/assets/cloud-alternate.png" alt="" draggable="false">
          <div class="thought-content" id="puzzle-slot" aria-label="围棋死活题图片预留位置"></div>
        </div>
        <span class="thought-link thought-link-one" aria-hidden="true"></span>
        <span class="thought-link thought-link-two" aria-hidden="true"></span>
        <span class="thought-link thought-link-three" aria-hidden="true"></span>
        <img class="loading-character" id="character" src="./loading-page/assets/loading-blink-fast.webp" alt="托着脸思考的角色" draggable="false">
        <div class="inspiration-bulb" id="bulb" role="progressbar" aria-label="资源加载" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bulb-fill-mask" aria-hidden="true">
            <svg class="bulb-fill" viewBox="0 0 100 100" preserveAspectRatio="none">
              <defs><linearGradient id="yellow-idea" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb937"/><stop offset=".5" stop-color="#ffdb62"/><stop offset="1" stop-color="#fff3a9"/></linearGradient></defs>
              <polygon id="fill-polygon" points="0,100 0,100 0,100" fill="url(#yellow-idea)"/>
            </svg>
          </div>
          <img class="bulb-outline" src="./loading-page/assets/bulb.png" alt="" draggable="false" aria-hidden="true">
          <img class="bulb-rays bulb-rays-top" src="./loading-page/assets/rays.png" alt="" aria-hidden="true">
        </div>
      </section>
      <p class="loading-tip" id="tip" aria-live="polite"></p>
    </div>
  </main>
  <details class="preview-tools">
    <summary>预览控制</summary>
    <div class="preview-controls">
      <button id="replay" type="button">播放完整加载</button>
      <div class="preview-states" aria-label="查看加载阶段"><button type="button" data-progress="0">0%</button><button type="button" data-progress="50">50%</button><button type="button" data-progress="100">100%</button></div>
      <label for="progress">加载进度 <output id="progress-output">0%</output></label>
      <input id="progress" type="range" min="0" max="100" value="0">
      <label class="puzzle-picker">预览死活题图片<input id="puzzle-input" type="file" accept="image/*"></label>
    </div>
  </details>
  <script src="./loading-page/tips.js"></script>
  <script src="./loading-page/bulb-geometry.js"></script>
  <script src="./loading-page/loading-page.js"></script>
</body>
</html>
