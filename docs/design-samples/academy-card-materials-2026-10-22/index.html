<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学院卡片材质 · 三版跨窗口比较</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./studio.css"></head><body>
<header><div><p>星炬学院围棋部 / 卡片材质 · 第二轮</p><h1>从角部装饰，做到有分量的纸面。</h1></div><a href="./README.md">参考与设计说明 ↗</a></header>
<div class="scope-note">三种材质，八类真实窗口。点击任意卡片，在下方查看完整窗口。</div>
<section class="variant-headings" aria-label="材质方向"><button data-variant="imprint" aria-pressed="false"><span class="variant-letter">A</span><div><h2>学院徽印</h2><p>超大裁切徽记 · 哑光底色</p><small>借鉴方舟档案的徽记尺度，沿用项目已有学院图形。</small></div></button><button data-variant="relief" aria-pressed="true"><span class="variant-letter">B</span><div><h2>工业浮雕</h2><p>实体切面 · 低浮雕层次</p><small>借鉴终末地的立体材质，角落像一块压印过的纸面。</small></div></button><button data-variant="screenprint" aria-pressed="false"><span class="variant-letter">C</span><div><h2>战术丝印</h2><p>实心块面 · 局部网点</p><small>把几何形状做成印刷块面，以留白控制密度。</small></div></button></section>
<div class="proof-board" aria-label="跨窗口实际卡片比较">
<section class="proof-row"><h3>履历 / 身份卡</h3><div><button data-proof="imprint" data-window="self" aria-label="查看学院徽印的履历 / 身份卡"><img src="./crop-imprint-self.png" alt="学院徽印 · 履历 / 身份卡"></button><button data-proof="relief" data-window="self" aria-label="查看工业浮雕的履历 / 身份卡"><img src="./crop-relief-self.png" alt="工业浮雕 · 履历 / 身份卡"></button><button data-proof="screenprint" data-window="self" aria-label="查看战术丝印的履历 / 身份卡"><img src="./crop-screenprint-self.png" alt="战术丝印 · 履历 / 身份卡"></button></div></section><section class="proof-row"><h3>好友 / 名单卡</h3><div><button data-proof="imprint" data-window="friends" aria-label="查看学院徽印的好友 / 名单卡"><img src="./crop-imprint-friends.png" alt="学院徽印 · 好友 / 名单卡"></button><button data-proof="relief" data-window="friends" aria-label="查看工业浮雕的好友 / 名单卡"><img src="./crop-relief-friends.png" alt="工业浮雕 · 好友 / 名单卡"></button><button data-proof="screenprint" data-window="friends" aria-label="查看战术丝印的好友 / 名单卡"><img src="./crop-screenprint-friends.png" alt="战术丝印 · 好友 / 名单卡"></button></div></section><section class="proof-row"><h3>仓库 / 详情卡</h3><div><button data-proof="imprint" data-window="warehouse" aria-label="查看学院徽印的仓库 / 详情卡"><img src="./crop-imprint-warehouse.png" alt="学院徽印 · 仓库 / 详情卡"></button><button data-proof="relief" data-window="warehouse" aria-label="查看工业浮雕的仓库 / 详情卡"><img src="./crop-relief-warehouse.png" alt="工业浮雕 · 仓库 / 详情卡"></button><button data-proof="screenprint" data-window="warehouse" aria-label="查看战术丝印的仓库 / 详情卡"><img src="./crop-screenprint-warehouse.png" alt="战术丝印 · 仓库 / 详情卡"></button></div></section><section class="proof-row"><h3>角色详情 / 技能卡</h3><div><button data-proof="imprint" data-window="handbook" aria-label="查看学院徽印的角色详情 / 技能卡"><img src="./crop-imprint-handbook.png" alt="学院徽印 · 角色详情 / 技能卡"></button><button data-proof="relief" data-window="handbook" aria-label="查看工业浮雕的角色详情 / 技能卡"><img src="./crop-relief-handbook.png" alt="工业浮雕 · 角色详情 / 技能卡"></button><button data-proof="screenprint" data-window="handbook" aria-label="查看战术丝印的角色详情 / 技能卡"><img src="./crop-screenprint-handbook.png" alt="战术丝印 · 角色详情 / 技能卡"></button></div></section>
