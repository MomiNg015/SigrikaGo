<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>左侧书签 · 设置窗口样板</title>
<style>
@font-face{font-family:"Sigrika Window Title";src:url('./LXGWMarkerGothic-Regular.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#eeece7;color:#44342e;font-family:'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #426e93;outline-offset:4px}header.preview-head{max-width:1500px;margin:auto;padding:26px 32px 20px;display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font-family:"Sigrika Window Title",sans-serif;font-size:29px;font-weight:400;margin:0}.preview-head p{font-size:13px;color:#675d54;margin:0}.samples{max-width:1500px;margin:auto;padding:0 28px 30px;display:grid;grid-template-columns:minmax(580px,1fr) 390px;gap:24px}.caption{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:0 3px 12px;color:#64594f}.caption strong{font-weight:600}.stage{position:relative;background-color:#e6e1d8;background-image:linear-gradient(#94877815 1px,transparent 1px),linear-gradient(90deg,#94877815 1px,transparent 1px);background-size:24px 24px;border-radius:14px;min-height:640px;padding:100px 30px 45px 122px;overflow:hidden}.phone-stage{width:390px;max-width:100%;height:740px;min-height:0;padding:96px 17px 30px 58px}.window{isolation:isolate;position:relative;min-height:480px;filter:drop-shadow(5px 6px 0 #4e3b3077)}.sheet{position:absolute;inset:0;z-index:1;background-color:#fffbf1;background-image:linear-gradient(#769aaf13 1px,transparent 1px),linear-gradient(90deg,#769aaf13 1px,transparent 1px);background-size:20px 20px;border:2px solid #4a362e;border-radius:18px 17px 15px 19px}.title{position:absolute;top:-46px;left:15px;width:168px;height:76px;object-fit:contain;z-index:4}.window-head{position:relative;z-index:2;display:flex;justify-content:flex-end;padding:14px 18px 10px;min-height:63px}.close{width:36px;height:36px;border:2px solid #4b352d;background:#f69db6;border-radius:11px;box-shadow:2px 3px 0 #584135;font-size:25px;line-height:1}.bookmarks{position:absolute;z-index:0;left:-99px;top:89px;width:121px;display:flex;flex-direction:column;gap:13px;isolation:isolate}.bookmark{border:0;background:none;position:relative;min-height:58px;width:121px;padding:0 24px 0 9px;display:grid;place-items:center;color:#473a32;isolation:isolate;transform:translateX(9px);transition:transform 180ms ease-out;--paper:#e4edf3;--turn:-.7deg}.bookmark:nth-child(2){--paper:#e4ebf2;--turn:.8deg}.bookmark:nth-child(3){--paper:#f4e2e5;--turn:-.4deg}.bookmark[aria-selected=true]{transform:translateX(0);--paper:#bfe3cd;color:#2e493c}.bookmark:nth-child(2)[aria-selected=true]{--paper:#b9d7eb;color:#30485b}.bookmark:nth-child(3)[aria-selected=true]{--paper:#efb9c7;color:#603645}.bookmark:hover:not([aria-selected=true]){transform:translateX(5px)}.bookmark:active{transform:translate(-1px,2px)}.bookmark svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;transform:rotate(var(--turn));filter:drop-shadow(1px 3px 0 #54443850)}.bookmark .paper{fill:var(--paper);stroke:#58473b;stroke-width:1.7;transition:fill 180ms}.bookmark .pencil{fill:none;stroke:#5e4d3a;stroke-opacity:.25;stroke-width:.8}.bookmark span{font-family:"Sigrika Window Title",sans-serif;font-size:23px;white-space:nowrap}.bookmark[aria-selected=true] span{transform:translateX(-1px)}.content{position:relative;z-index:2;padding:8px 27px 24px;min-height:385px}.content h2{font-family:"Sigrika Window Title",sans-serif;font-size:25px;font-weight:400;margin:0 0 8px}.intro{margin:0 0 19px;font-size:12px;color:#6c6258;line-height:1.8}.audio-row{padding:14px 0 18px;border-bottom:1px solid #7d6a5533}.audio-row:last-child{border:0}.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px}.row-head label{font-weight:600}.row-head output{font-variant-numeric:tabular-nums;color:#6b5b4e;font-size:13px}.range-line{display:flex;align-items:center;gap:16px}input[type=range]{accent-color:#6b997e;width:100%;height:15px;cursor:pointer}.mute{flex:none;border:1px solid #847467;background:#fffcf6;border-radius:7px;padding:5px 10px;min-height:31px;color:#594c41;font-size:12px}.mute[aria-pressed=true]{background:#edd0d4;color:#632e3a}.local-note{position:relative;z-index:2;border-top:1px dashed #95877666;margin:0 26px;padding:13px 0 17px;font-size:11px;color:#786c61;line-height:1.6}.panel[hidden]{display:none}.theme-choices{display:grid;gap:14px;padding-top:6px}.theme-choice{text-align:left;border:2px solid #cabca8;border-radius:10px;padding:16px;background:#fffdf7;display:flex;gap:15px;align-items:center;color:#44372d}.theme-choice[aria-pressed=true]{border-color:#678873;background:#eef5ec}.swatch{display:block;width:43px;height:43px;background:#efe5cb;border:1px solid #a7987d;border-radius:8px}.theme-choice:nth-child(2) .swatch{background:#3d4c69}.theme-choice strong{display:block;font-size:14px;margin-bottom:5px}.theme-choice small{color:#736451}.about-card{margin-top:26px;padding:25px 18px;background:#faf5e6;border:1px solid #bdad95;border-radius:8px;line-height:1.9;font-size:14px}.about-card strong{font-family:"Sigrika Window Title",sans-serif;font-weight:400;font-size:25px}.about-card p{margin:12px 0}.phone-stage .window{min-height:578px}.phone-stage .title{width:145px;left:4px;top:-40px;height:65px}.phone-stage .window-head{padding:12px 14px 5px;min-height:58px}.phone-stage .bookmarks{left:-45px;width:64px;top:83px;gap:12px}.phone-stage .bookmark{width:64px;height:89px;min-height:89px;transform:translateX(5px);padding:5px 19px 5px 0}.phone-stage .bookmark[aria-selected=true]{transform:translateX(0)}.phone-stage .bookmark span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:5px;font-size:20px}.phone-stage .content{padding:15px 19px 22px;min-height:424px}.phone-stage .content h2{font-size:23px}.phone-stage .intro{font-size:11px;margin-bottom:13px}.phone-stage .audio-row{padding:17px 0 21px}.phone-stage .local-note{margin:0 18px}.phone-stage .theme-choice{padding:13px 10px;gap:10px}.phone-stage .theme-choice small{font-size:11px}.preview-toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#44372e;color:#fffaf1;padding:12px 20px;border-radius:8px;z-index:10;font-size:13px}.preview-toast[hidden]{display:none}@media(max-width:1090px){.samples{grid-template-columns:1fr;max-width:940px}.phone-sample{width:390px;max-width:100%;margin:auto}.preview-head{align-items:flex-start}.preview-head p{max-width:250px;line-height:1.7}}@media(max-width:650px){header.preview-head{padding:22px 16px;display:block}h1{font-size:25px}.preview-head p{margin-top:10px;max-width:none}.samples{padding:0 12px 25px}.desktop-sample{display:none}.phone-stage{width:100%}.phone-sample{width:390px;max-width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
<header class="preview-head"><h1>左侧书签 · 设置窗口</h1><p>点击书签切换内容，查看选中与悬停效果</p></header>
<main class="samples"><section class="desktop-sample"><div class="caption"><strong>桌面 · 横向书签</strong><span>霞鹜字体 / 淡色纸签</span></div><div class="stage" data-demo="desktop"></div></section><section class="phone-sample"><div class="caption"><strong>手机 · 竖向书签</strong><span>390px 竖屏</span></div><div class="stage phone-stage" data-demo="phone"></div></section></main>
<div class="preview-toast" role="status" hidden></div>
<script>
const paper=`<svg viewBox="0 0 124 60" preserveAspectRatio="none" aria-hidden="true"><path class="paper" d="M10 3 Q26 1 46 3 L80 2 L121 4 L122 56 L87 57 Q63 56 43 58 L10 56 L4 53 L5 39 L3 23 L5 8 Z"/><path class="pencil" d="M11 7 Q30 5 46 7 L80 6 L115 7 M8 14 L9 35 L8 49 Q37 54 53 52 L110 53"/><path d="M8 9 L14 5" fill="none" stroke="#fffdf7" stroke-width="1.3" opacity=".7"/></svg>`;
const tabs=[['audio','音频'],['theme','界面'],['about','关于']];
const volumeItems=[['master','主音量',80],['bgm','背景音乐',60],['sfx','提示音',75],['voice','语音',90]];
for(const stage of document.querySelectorAll('[data-demo]')){
const id=stage.dataset.demo;
stage.innerHTML=`<section class="window" aria-label="设置窗口样板"><div class="sheet"></div><img class="title" src="./settings.webp" alt="设置"><nav class="bookmarks" role="tablist" aria-label="设置分类" aria-orientation="vertical">${tabs.map(([key,label],i)=>`<button class="bookmark" role="tab" id="${id}-tab-${key}" aria-controls="${id}-panel-${key}" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${paper}<span>${label}</span></button>`).join('')}</nav><div class="window-head"><button class="close" aria-label="关闭预览">×</button></div><div class="content"><section class="panel" id="${id}-panel-audio" role="tabpanel" aria-labelledby="${id}-tab-audio"><h2>声音设置</h2><p class="intro">调节游戏中的音乐、提示音与角色语音。</p>${volumeItems.map(([key,label,value])=>`<div class="audio-row"><div class="row-head"><label for="${id}-${key}">${label}</label><output for="${id}-${key}">${value}%</output></div><div class="range-line"><input id="${id}-${key}" type="range" min="0" max="100" value="${value}"><button class="mute" aria-label="${label}静音" aria-pressed="false">静音</button></div></div>`).join('')}</section><section class="panel" id="${id}-panel-theme" role="tabpanel" aria-labelledby="${id}-tab-theme" hidden><h2>界面风格</h2><p class="intro">选择喜欢的游戏界面。</p><div class="theme-choices"><button class="theme-choice" aria-pressed="true"><span class="swatch"></span><span><strong>明亮校园</strong><small>纸页、墨线与彩色书签</small></span></button><button class="theme-choice" aria-pressed="false"><span class="swatch"></span><span><strong>经典界面</strong><small>简洁的深色游戏界面</small></span></button></div></section><section class="panel" id="${id}-panel-about" role="tabpanel" aria-labelledby="${id}-tab-about" hidden><h2>关于游戏</h2><p class="intro">欢迎来到西格莉卡围棋社。</p><div class="about-card"><strong>SigrikaGo</strong><p>和喜欢的角色一起，开始下一盘对弈。</p><p>星炬 · 标准 · 五子棋</p></div></section></div><div class="local-note">交互样板 · 操作仅在本页预览</div></section>`;
const buttons=[...stage.querySelectorAll('[role=tab]')];
function activate(index,focus=false){buttons.forEach((button,i)=>{button.setAttribute('aria-selected',String(i===index));button.tabIndex=i===index?0:-1;stage.querySelector('#'+button.getAttribute('aria-controls')).hidden=i!==index});if(focus)buttons[index].focus()}
buttons.forEach((button,i)=>{button.addEventListener('click',()=>activate(i));button.addEventListener('keydown',event=>{let next;if(event.key==='ArrowDown')next=(i+1)%buttons.length;else if(event.key==='ArrowUp')next=(i-1+buttons.length)%buttons.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=buttons.length-1;else return;event.preventDefault();activate(next,true)})});
stage.querySelectorAll('input[type=range]').forEach(input=>input.addEventListener('input',()=>{input.closest('.audio-row').querySelector('output').value=input.value+'%'}));
stage.querySelectorAll('.mute').forEach(button=>button.addEventListener('click',()=>{const muted=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(muted));button.textContent=muted?'已静音':'静音'}));
stage.querySelectorAll('.theme-choice').forEach(button=>button.addEventListener('click',()=>{stage.querySelectorAll('.theme-choice').forEach(choice=>choice.setAttribute('aria-pressed',String(choice===button)));toast('已选择：'+button.querySelector('strong').textContent+'（预览）')}));
stage.querySelector('.close').addEventListener('click',()=>toast('这是独立样板，可直接关闭预览标签页。'));
}
let toastTimer;function toast(text){const el=document.querySelector('.preview-toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}
</script>
</html>
